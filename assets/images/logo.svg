<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none" role="img" aria-label="Logo Studio Flexarion">
  <!-- Anneau orbital externe incliné -->
  <ellipse cx="80" cy="80" rx="66" ry="22" transform="rotate(-30 80 80)" stroke="#6d28d9" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Anneau orbital interne pointillé -->
  <ellipse cx="80" cy="80" rx="50" ry="15" transform="rotate(25 80 80)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="6 4"/>

  <!-- Satellites en orbite -->
  <circle cx="130" cy="51" r="2.5" fill="#e2e8f0"/>
  <circle cx="30" cy="109" r="2" fill="#8b5cf6"/>

  <!-- Cœur planétaire sobre -->
  <circle cx="80" cy="80" r="24" fill="#161b24" stroke="#6d28d9" stroke-width="1.5"/>
  <circle cx="80" cy="80" r="14" fill="#202734"/>
  <circle cx="80" cy="80" r="4" fill="#a78bfa"/>
  
  <!-- Réticules de mesure scientifique -->
  <line x1="80" y1="48" x2="80" y2="54" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="80" y1="106" x2="80" y2="112" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="48" y1="80" x2="54" y2="80" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="106" y1="80" x2="112" y2="80" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none" role="img" aria-label="Rendu in-game d'Anni 2810 : manœuvre orbitale de l'Explorateur Anni autour de l'Artefact">
  <defs>
    <radialGradient id="artefactField" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5b21b6" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#2e1065" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thrustPlume" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#090b0e"/>

  <!-- Champ de débris et de glace de la ceinture de Kuiper -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="120" cy="180" r="1.5"/>
    <circle cx="340" cy="90" r="1"/>
    <circle cx="560" cy="240" r="2"/>
    <circle cx="780" cy="110" r="1.5"/>
    <circle cx="980" cy="310" r="2"/>
    <circle cx="1120" cy="140" r="1"/>
    <circle cx="1450" cy="220" r="1.5"/>
    <circle cx="1780" cy="80" r="1"/>
    <circle cx="210" cy="740" r="2"/>
    <circle cx="480" cy="880" r="1.5"/>
    <circle cx="890" cy="920" r="1"/>
    <circle cx="1320" cy="860" r="2"/>
    <circle cx="1680" cy="790" r="1.5"/>
  </g>

  <!-- Puits gravitationnel de l'Artefact -->
  <circle cx="1250" cy="480" r="620" fill="url(#artefactField)"/>
  <ellipse cx="1250" cy="480" rx="480" ry="280" stroke="#4c1d95" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.6"/>
  <ellipse cx="1250" cy="480" rx="320" ry="190" stroke="#6d28d9" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- L'Artefact (Mégastructure alien colossale de 82 km) -->
  <g transform="translate(1250, 480)">
    <!-- Monolithe hexagonal titanesque -->
    <polygon points="0,-160 140,-80 140,80 0,160 -140,80 -140,-80" fill="#11151c" stroke="#6d28d9" stroke-width="4"/>
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#161b24" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Cœur énergétique de matière noire -->
    <circle cx="0" cy="0" r="35" fill="#2e1065" stroke="#a78bfa" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#f8fafc"/>
  </g>

  <!-- Trajectoire orbitale de l'Explorateur Anni -->
  <path d="M 200,920 C 450,880 720,720 950,560 C 1150,420 1350,280 1600,320" 
        stroke="#8b5cf6" stroke-width="3" stroke-dasharray="14 8" fill="none"/>

  <!-- Vaisseau l'Explorateur Anni (Vaisseau joueur avec propulseurs orientables) -->
  <g transform="translate(680, 680) rotate(-32)">
    <!-- Poussée réacteur principale -->
    <polygon points="-60,-12 -140,-35 -140,35 -60,12" fill="url(#thrustPlume)"/>
    <!-- Coque modulaire -->
    <polygon points="90,0 20,-24 -60,-28 -60,28 20,24" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5"/>
    <!-- Module de commandement / verrière -->
    <polygon points="50,0 20,-10 -10,-10 -10,10 20,10" fill="#10141a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="20" cy="0" r="3" fill="#38bdf8"/>
    <!-- Sas d'arrimage et antennes RCS -->
    <line x1="-20" y1="-28" x2="-20" y2="-45" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="-20" cy="-45" r="3" fill="#e2e8f0"/>
    <line x1="-20" y1="28" x2="-20" y2="45" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="-20" cy="45" r="3" fill="#e2e8f0"/>
  </g>

  <!-- HUD In-Engine Télémétrie C++ Vulkan -->
  <!-- Panneau supérieur droit -->
  <rect x="1450" y="60" width="410" height="150" rx="4" fill="#10141a" stroke="#202734" stroke-width="1.5"/>
  <text x="1480" y="98" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a78bfa">ANNI 2810 &bull; CAPTEURS ORBITAUX</text>
  <text x="1480" y="128" font-family="ui-monospace, monospace" font-size="12" fill="#8b9bb0">Cible : Mégastructure L'Artefact</text>
  <text x="1480" y="152" font-family="ui-monospace, monospace" font-size="12" fill="#8b9bb0">Périgée : 412.8 km &bull; Excentricité : 0.084</text>
  <text x="1480" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">&Delta;V Rétro-propulsion : -240.5 m/s (Succès)</text>

  <!-- Panneau inférieur gauche -->
  <rect x="60" y="920" width="440" height="95" rx="4" fill="#10141a" stroke="#202734" stroke-width="1.5"/>
  <text x="85" y="955" font-family="ui-monospace, monospace" font-size="12.5" font-weight="600" fill="#f8fafc">Moteur C++ Propriétaire &bull; Pipeline Vulkan</text>
  <text x="85" y="980" font-family="ui-monospace, monospace" font-size="11.5" fill="#8b9bb0">Rendu temps réel 4K &bull; Voxel Cone Tracing 60 FPS</text>

  <!-- Mention officielle -->
  <text x="1860" y="1035" font-family="ui-monospace, monospace" font-size="12" fill="#475569" text-anchor="end">STUDIO FLEXARION &bull; AIX-EN-PROVENCE &bull; COPYRIGHT 2026</text>
</svg>
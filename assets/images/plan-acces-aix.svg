<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none" role="img" aria-label="Plan d'accès et localisation du Studio Flexarion à Aix-en-Provence">
  <!-- Fond de carte sobre -->
  <rect width="800" height="450" fill="#090b0e"/>

  <!-- Tracés des axes routiers -->
  <path d="M 0,260 Q 300,240 500,280 T 800,250" stroke="#1f2633" stroke-width="4" fill="none"/>
  <text x="720" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#5c6b7e">A8 &bull; La Provençale</text>

  <!-- A51 vers Marseille -->
  <path d="M 450,0 Q 460,180 430,320 T 400,450" stroke="#1f2633" stroke-width="3" fill="none"/>
  <text x="390" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#5c6b7e">A51 &bull; Marseille</text>

  <!-- D9 vers Gare TGV & Aéroport -->
  <path d="M 450,220 L 160,340" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>
  <text x="250" y="295" font-family="ui-monospace, monospace" font-size="10" fill="#60a5fa">D9 &bull; Liaison TGV / Technopôle</text>

  <!-- Silhouette sobre de la Sainte-Victoire -->
  <polygon points="560,180 620,135 680,118 740,150 800,140 800,210 540,210" fill="#131722"/>
  <text x="670" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#5c6b7e">Montagne Sainte-Victoire</text>

  <!-- Centre-Ville Aix-en-Provence -->
  <circle cx="480" cy="200" r="14" fill="#161b24" stroke="#475569" stroke-width="1.5"/>
  <circle cx="480" cy="200" r="4" fill="#94a3b8"/>
  <text x="505" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Centre d'Aix-en-Provence</text>
  <text x="505" y="213" font-family="ui-monospace, monospace" font-size="10" fill="#8b9bb0">La Rotonde &bull; Cours Mirabeau</text>

  <!-- Gare d'Aix-en-Provence TGV -->
  <g transform="translate(180,330)">
    <rect x="-12" y="-12" width="24" height="24" rx="2" fill="#161b24" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#60a5fa"/>
    <text x="20" y="-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Gare Aix TGV</text>
    <text x="20" y="13" font-family="ui-monospace, monospace" font-size="10" fill="#8b9bb0">Paris (3h) &bull; Lyon (1h)</text>
  </g>

  <!-- Aéroport Marseille-Provence -->
  <g transform="translate(70,410)">
    <circle cx="0" cy="0" r="8" fill="#161b24" stroke="#475569" stroke-width="1"/>
    <text x="16" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#8b9bb0">Aéroport Marseille-Provence (15 min)</text>
  </g>

  <!-- EMPLACEMENT STUDIO FLEXARION -->
  <g transform="translate(290,240)">
    <circle cx="0" cy="0" r="24" fill="#6d28d9" opacity="0.12"/>
    <circle cx="0" cy="0" r="10" fill="#4c1d95" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    
    <!-- Étiquette sobre -->
    <rect x="-105" y="-56" width="210" height="40" rx="3" fill="#10141a" stroke="#6d28d9" stroke-width="1.2"/>
    <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">STUDIO FLEXARION</text>
    <text x="0" y="-23" font-family="ui-monospace, monospace" font-size="9.5" fill="#c4b5fd" text-anchor="middle">Technopôle de l'Arbois &bull; 13100 Aix</text>
  </g>

  <!-- Cartouche d'informations -->
  <rect x="25" y="25" width="280" height="85" rx="3" fill="#10141a" stroke="#202734" stroke-width="1"/>
  <text x="38" y="46" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#a78bfa">ACCÈS & ANCRAGE PROVENÇAL</text>
  <text x="38" y="65" font-family="ui-monospace, monospace" font-size="10.5" fill="#8b9bb0">&bull; Technopôle de l'Arbois &bull; Aix-en-Provence</text>
  <text x="38" y="81" font-family="ui-monospace, monospace" font-size="10.5" fill="#8b9bb0">&bull; Gare TGV à 10 min (D9)</text>
  <text x="38" y="97" font-family="ui-monospace, monospace" font-size="10.5" fill="#8b9bb0">&bull; Permanence sur rendez-vous</text>
</svg>
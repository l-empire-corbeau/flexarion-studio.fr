<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none" role="img" aria-label="Concept visuel de Nexus Void : exploration procédurale du vide interstellaire">
  <defs>
    <radialGradient id="voidCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#090b0e"/>

  <!-- Grille spatiale isométrique -->
  <g stroke="#171c26" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="475" x2="1200" y2="475"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Anomalie du vide (Singularité centrale) -->
  <circle cx="600" cy="337" r="240" fill="url(#voidCore)"/>
  <ellipse cx="600" cy="337" rx="180" ry="80" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <ellipse cx="600" cy="337" rx="120" ry="50" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Étoiles & Débris d'astéroïdes -->
  <g fill="#8b9bb0" opacity="0.6">
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="280" cy="80" r="1"/>
    <circle cx="340" cy="220" r="2"/>
    <circle cx="890" cy="140" r="1.5"/>
    <circle cx="1020" cy="95" r="1"/>
    <circle cx="950" cy="480" r="2"/>
    <circle cx="210" cy="520" r="1.5"/>
    <circle cx="450" cy="580" r="1"/>
    <circle cx="780" cy="590" r="1.5"/>
  </g>

  <!-- Vaisseau Éclaireur Isométrique -->
  <g transform="translate(380, 260) rotate(-15)">
    <polygon points="0,-16 28,12 0,6 -28,12" fill="#161b24" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="0" cy="2" r="3" fill="#6d28d9"/>
    <line x1="-12" y1="10" x2="-20" y2="24" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="12" y1="10" x2="20" y2="24" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>

  <!-- Cartouche d'ingénierie UI -->
  <rect x="50" y="50" width="340" height="95" rx="4" fill="#10141a" stroke="#202734" stroke-width="1"/>
  <text x="70" y="78" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#a78bfa">NEXUS VOID &bull; ROGUELIKE SPATIAL</text>
  <text x="70" y="100" font-family="ui-monospace, monospace" font-size="11" fill="#8b9bb0">Génération procédurale de systèmes stellaires</text>
  <text x="70" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">Moteur : Flexarion ECS &bull; Vue Isométrique</text>

  <text x="1150" y="635" font-family="ui-monospace, monospace" font-size="11" fill="#475569" text-anchor="end">FLEXARION STUDIO &bull; CONCEPT ART OFFICIEL</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none" role="img" aria-label="Concept visuel de Chronos Drift : dilatation temporelle et énigmes causales">
  <defs>
    <radialGradient id="timeRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#090b0e"/>

  <!-- Ondes d'entropie temporelle -->
  <circle cx="600" cy="337" r="300" fill="url(#timeRipple)"/>
  <circle cx="600" cy="337" r="240" stroke="#202734" stroke-width="1.5" stroke-dasharray="10 8"/>
  <circle cx="600" cy="337" r="180" stroke="#3c495e" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="600" cy="337" r="120" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="600" cy="337" r="60" stroke="#c4b5fd" stroke-width="1.5"/>

  <!-- Cadran temporel géométrique & axes de causalité -->
  <line x1="600" y1="50" x2="600" y2="625" stroke="#1f2633" stroke-width="1.5"/>
  <line x1="200" y1="337" x2="1000" y2="337" stroke="#1f2633" stroke-width="1.5"/>

  <!-- Vaisseau générationnel 'Éternité' (silhouette brutaliste) -->
  <g transform="translate(600, 337)">
    <polygon points="-80,-25 80,-25 120,0 80,25 -80,25 -100,0" fill="#161b24" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="-40" y="-15" width="80" height="30" fill="#10141a" stroke="#6d28d9" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#a78bfa"/>
  </g>

  <!-- Lignes temporelles convergentes -->
  <path d="M 150,150 C 350,150 450,300 600,337" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M 150,525 C 350,525 450,374 600,337" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Cartouche d'ingénierie UI -->
  <rect x="50" y="50" width="350" height="95" rx="4" fill="#10141a" stroke="#202734" stroke-width="1"/>
  <text x="70" y="78" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#fbbf24">CHRONOS DRIFT &bull; PUZZLE NARRATIF</text>
  <text x="70" y="100" font-family="ui-monospace, monospace" font-size="11" fill="#8b9bb0">Dilatation temporelle &bull; Paradoxes causaux</text>
  <text x="70" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd">Architecture narrative non-linéaire</text>

  <text x="1150" y="635" font-family="ui-monospace, monospace" font-size="11" fill="#475569" text-anchor="end">FLEXARION STUDIO &bull; EXPÉRIMENTATION NARRATIVE</text>
</svg>
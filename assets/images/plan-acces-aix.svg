<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none" role="img" aria-label="Plan d'accès et localisation du Studio Flexarion à Aix-en-Provence">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="victoireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Fond de carte sombre moderne -->
  <rect width="800" height="450" fill="url(#mapBg)"/>

  <!-- Tracés des axes routiers (A8 La Provençale, A51, D9) -->
  <path d="M 0,260 Q 300,240 500,280 T 800,250" stroke="#334155" stroke-width="6" fill="none"/>
  <path d="M 0,260 Q 300,240 500,280 T 800,250" stroke="#475569" stroke-width="3" fill="none"/>
  <text x="720" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748b">A8 &bull; La Provençale</text>

  <!-- A51 vers Marseille -->
  <path d="M 450,0 Q 460,180 430,320 T 400,450" stroke="#334155" stroke-width="5" fill="none"/>
  <text x="390" y="435" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748b">A51 &bull; Marseille</text>

  <!-- D9 vers Gare TGV & Aéroport -->
  <path d="M 450,220 L 160,340" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
  <text x="260" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#60a5fa">D9 &bull; Liaison TGV / Technopôle</text>

  <!-- Silhouette stylisée de la Montagne Sainte-Victoire (Symbole aixois) -->
  <polygon points="560,180 620,130 680,110 740,150 800,140 800,210 540,210" fill="url(#victoireGrad)" opacity="0.6"/>
  <text x="670" y="100" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#94a3b8">Montagne Sainte-Victoire (1 011 m)</text>

  <!-- Centre-Ville Aix-en-Provence (Le Cours Mirabeau, Rotonde) -->
  <circle cx="480" cy="200" r="18" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="480" cy="200" r="6" fill="#94a3b8"/>
  <text x="510" y="200" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Centre Historique d'Aix-en-Provence</text>
  <text x="510" y="216" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">La Rotonde &bull; Cours Mirabeau</text>

  <!-- Gare d'Aix-en-Provence TGV -->
  <g transform="translate(180,330)">
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">🚆</text>
    <text x="25" y="-2" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Gare Aix-en-Provence TGV</text>
    <text x="25" y="14" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Liaison directe Paris (3h) & Lyon (1h)</text>
  </g>

  <!-- Aéroport Marseille-Provence -->
  <g transform="translate(70,410)">
    <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">✈️</text>
    <text x="20" y="4" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Aéroport Marseille-Provence (à 15 min)</text>
  </g>

  <!-- EMPLACEMENT STUDIO FLEXARION (Technopôle de l'Arbois) -->
  <g transform="translate(290,240)">
    <circle cx="0" cy="0" r="45" fill="#7c3aed" opacity="0.15"/>
    <circle cx="0" cy="0" r="28" fill="#7c3aed" opacity="0.3"/>
    <circle cx="0" cy="0" r="14" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    
    <!-- Étiquette Studio Flexarion -->
    <rect x="-120" y="-68" width="240" height="46" rx="6" fill="#18132b" stroke="#7c3aed" stroke-width="2"/>
    <text x="0" y="-48" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">STUDIO FLEXARION</text>
    <text x="0" y="-32" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle">Technopôle de l'Arbois &bull; 13100 Aix</text>
  </g>

  <!-- Cartouche d'informations en haut à gauche -->
  <rect x="25" y="25" width="290" height="90" rx="6" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a855f7">ACCÈS & ANCRAGE PROVENÇAL</text>
  <text x="40" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">&bull; Technopôle de l'Arbois &bull; Aix-en-Provence</text>
  <text x="40" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">&bull; Gare TGV à 10 min en navette D9</text>
  <text x="40" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">&bull; Permanence presse sur rendez-vous</text>
</svg>

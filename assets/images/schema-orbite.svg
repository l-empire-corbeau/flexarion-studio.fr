<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none" role="img" aria-label="Schéma orbital de l'Explorateur Anni autour de la mégastructure l'Artefact">
  <!-- Fond spatial sobre -->
  <rect width="800" height="450" fill="#090b0e"/>
  
  <!-- Grille télémétrique discrète -->
  <g stroke="#1a202c" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Puits de gravité / Iso-surfaces géodésiques sobres -->
  <ellipse cx="480" cy="225" rx="140" ry="115" stroke="#2e1065" stroke-width="1" stroke-dasharray="4 6"/>
  <ellipse cx="480" cy="225" rx="90" ry="75" stroke="#5b21b6" stroke-width="1" stroke-dasharray="5 5" stroke-opacity="0.6"/>

  <!-- L'Artefact (Mégastructure alien) -->
  <polygon points="480,185 520,205 520,245 480,265 440,245 440,205" fill="#161b24" stroke="#6d28d9" stroke-width="2"/>
  <circle cx="480" cy="225" r="10" fill="#4c1d95"/>
  <circle cx="480" cy="225" r="3" fill="#ffffff"/>
  <text x="480" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.05em">L'ARTEFACT</text>
  <text x="480" y="308" font-family="ui-monospace, monospace" font-size="11" fill="#8b9bb0" text-anchor="middle">Diamètre : 82.4 km | Puits gravifique : 1.42 G</text>

  <!-- Trajectoire orbitale de l'Explorateur Anni -->
  <path d="M 90,80 C 180,140 280,280 410,310 C 530,340 640,260 620,160 C 600,70 470,80 390,130 C 330,170 320,230 350,260" 
        stroke="#8b5cf6" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="8 4"/>

  <!-- Vecteurs de poussée & manœuvre Delta-V -->
  <g transform="translate(410,310)">
    <circle cx="0" cy="0" r="4" fill="#a78bfa"/>
    <line x1="0" y1="0" x2="30" y2="12" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="34,14 26,9 28,18" fill="#a78bfa"/>
    <text x="-15" y="24" font-family="ui-monospace, monospace" font-size="10" fill="#c4b5fd">&Delta;V Hohmann (-380 m/s)</text>
  </g>

  <!-- Vaisseau Explorateur Anni -->
  <g transform="translate(620,160)">
    <polygon points="0,-10 12,6 -12,6" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#a78bfa"/>
    <text x="20" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Explorateur Anni</text>
    <text x="20" y="12" font-family="ui-monospace, monospace" font-size="10" fill="#8b9bb0">v = 18.2 km/s</text>
  </g>

  <!-- Cartouche télémétrique en haut à gauche -->
  <rect x="25" y="25" width="280" height="85" rx="4" fill="#10141a" stroke="#202734" stroke-width="1"/>
  <text x="40" y="47" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#a78bfa">TÉLÉMÉTRIE ORBITALE &bull; MOTEUR C++</text>
  <text x="40" y="66" font-family="ui-monospace, monospace" font-size="10.5" fill="#8b9bb0">Algorithme : Verlet Symplectique Ordre 4</text>
  <text x="40" y="82" font-family="ui-monospace, monospace" font-size="10.5" fill="#8b9bb0">Tick physique : 120 Hz Contigu SoA</text>
  <text x="40" y="98" font-family="ui-monospace, monospace" font-size="10.5" fill="#34d399">Conservation énergie : &plusmn; 0.00012%</text>

  <!-- Mention bas de page -->
  <text x="770" y="430" font-family="ui-monospace, monospace" font-size="10" fill="#475569" text-anchor="end">FLEXARION STUDIO &bull; SIMULATION NEWTONIENNE</text>
</svg>